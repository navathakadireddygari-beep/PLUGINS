<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Plan</title>
    <script>
      // Read by src/config/app-config.ts. `proposal_id` is the proposal whose
      // Buy Plan is loaded/saved (can also be passed as ?proposal_id=);
      // `api_endpoint` + app_user/app_roles feed every request — same config
      // shape APEX injects for FIN_EVAL/MA (same page code, different bundle).
      // Inside APEX, also set ajaxId/flowId/stepId/instance so the auth
      // callback can mint a token; outside APEX, the OAuth path is used
      // instead (see src/api/auth-api.ts) and needs no host-supplied secret.
      window.__BUYPLAN_CONFIG__ = {
        proposal_id: 890,
        // Explicit override for local testing only — APEX doesn't send this;
        // created_by normally falls back to the numeric app_user below.
        user_id: 12345,
        api_endpoint: "%VITE_DEV_API_ENDPOINT%",  // from PLUGINS/.env
        app_user: "%VITE_DEV_APP_USER%",      // from PLUGINS/.env
        app_roles: "APP_FIN_GIS_SPC_AUTHOR_SPC_ALL,APP_FIN_GIS_RLS_NA_AUTOMOTIVE_SPC_ALL",
        app_language: "en",
        // ajaxId: "ajaxId",
        // flowId: "flowId",
        // stepId: "stepId",
        // instance: "instance",
      };
    </script>
  </head>
  <body>
    <div id="ma-buyplan-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
