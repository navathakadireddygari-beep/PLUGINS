<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Report</title>
    <script>
      // ── Widget config (single source of truth) ──────────────────
      // Read by src/config/app-config.ts at runtime.
      // Case 1 — proposal exists:  set proposal_id, leave spc_type_id null
      // Case 2 — no proposal yet:  set spc_type_id, leave proposal_id null
      window.__APP_CONFIG__ = {
        proposal_id:  562,                // number | null  e.g. 1234
        spc_type_id:  null,                // number | null  e.g. 1062  (101=PRODUCT_DEVELOPMENT template)
        template_type_id: null,            // number | null  template selector for new evaluations
        app_user:     "satish.Mallagundla@test.exp.com",
        // Use the Vite proxy path "/api" so requests don't hit the remote server
        // directly from the browser — avoids CORS preflight failures for custom
        // headers (user_email, role, Authorization). The proxy (vite.config.ts)
        api_endpoint: "/api",
        // Optional — APEX OAuth AJAX call (src/api/auth-api.ts)
        // ajaxId:   "ajaxId",
        // flowId:   "flowId",
        // stepId:   "stepId",
        // instance: "instance",
      };
    </script>
  </head>
  <body>
    <div id="investment-report-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
