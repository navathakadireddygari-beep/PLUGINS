      // instead (see src/api/auth-api.ts) and needs no host-supplied secret.
      window.__APP_CONFIG__ = {
        proposal_id: 1223,
        // Numeric GIS user id, sent as `created_by` on Buy Plan adjustments.
        // user_id: 12345,
        api_endpoint: "https://gisuat.uk.experian.com/ords/xxexp_gis_v1",
        app_user: "arvind.tammineni@test.exp.com",
        app_roles: "APP_FIN_GIS_SPC_AUTHOR_SPC_ALL,APP_FIN_GIS_RLS_NA_AUTOMOTIVE_SPC_ALL",
        // ajaxId: "ajaxId",
        // flowId: "flowId",
        // stepId: "stepId",
        // instance: "instance",
      };
    </script>
